<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimya9-2D-2Y-Hazirlik</title>
    <!-- Öğrenci verileri bu dosyadan çekilir -->
    <script src="js/ogrenci_verileri2025-2026.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr 300px;
            gap: 15px;
            width: 100%;
            max-width: 1250px;
            align-items: start;
        }

        /* Sol Panel */
        .student-panel {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            font-size: 0.85em;
            position: sticky;
            top: 10px;
        }
        .student-panel h3 { 
            color: #667eea; margin: 0 0 10px 0; padding-bottom: 6px; 
            border-bottom: 2px solid #f0f0f0; text-align: center; font-size: 1.1em; 
        }
        
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: 600; color: #555; }
        .form-group input { width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9em; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 8px; border: none; 
            border-radius: 4px; cursor: pointer; font-size: 0.9em; font-weight: 600; width: 100%; margin-top: 5px; 
        }
        .btn:hover { opacity: 0.9; }

        /* Rapor Listesi */
        #history-section {
            margin-top: 10px;
            border-top: 2px solid #667eea;
            padding-top: 8px;
        }
        #results-list {
            max-height: 350px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 6px;
            padding: 4px;
        }
        .result-row {
            display: grid;
            /* No | Ad Soyad | Sınıf | Puan */
            grid-template-columns: 55px 1fr 55px 75px; 
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
            border-radius: 4px;
            margin-bottom: 3px;
            font-size: 0.82em;
        }
        .result-row:first-child { border-left: 3px solid #28a745; }
        .result-row:last-child { border-bottom: none; }
        .result-row .no-badge { font-weight: 700; color: #667eea; background: #eef2ff; padding: 2px 4px; border-radius: 3px; text-align: center; }
        .result-row .name { font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-row .class-info { color: #666; font-size: 0.85em; text-align: center; }
        .result-row .score { font-weight: 700; color: #155724; background: #d4edda; padding: 2px 6px; border-radius: 4px; text-align: center; }

        /* ORTA PANEL (Quiz) */
        .quiz-panel {
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); 
            min-height: 450px; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            padding-top: 25px;
        }
        h2 { color: #333; text-align: center; margin: 0 0 10px 0; font-size: 1.3em; }
        
        .question-box { 
            margin-bottom: 8px; 
            padding: 10px; 
            background: linear-gradient(135deg, #fff0f5 0%, #ffeef7 100%); 
            border-left: 4px solid #ff69b4; 
            border-radius: 6px; 
        }
        .question-text { 
            font-size: 1.1em; 
            margin-bottom: 30px; 
            font-weight: 600; 
            color: #444; 
            line-height: 1.3; 
        }
        
        .options { display: flex; flex-direction: column; gap: 3px; }
        .option-btn { 
            padding: 5px 8px; 
            border: 1px solid #ddd; 
            background: white; 
            cursor: pointer; 
            border-radius: 4px; 
            transition: all 0.1s; 
            text-align: left; 
            font-size: 0.85em; 
        }
        .option-btn:hover { background-color: #f0f0f0; border-color: #667eea; }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; font-weight: 600; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }

        /* D/Y İlerleme Takipçisi */
        #progress-tracker {
            display: flex; justify-content: center; gap: 4px; margin-top: 10px; flex-wrap: wrap;
            padding: 5px; background: #f8f9fa; border-radius: 6px; border: 1px solid #eee;
        }
        .progress-icon {
            width: 20px; height: 20px; border-radius: 50%; border: 1px solid #ccc;
            display: flex; justify-content: center; align-items: center;
            font-size: 9px; font-weight: 800; color: transparent;
            background: white;
        }
        .progress-icon.correct { background: #28a745; border-color: #28a745; color: white; }
        .progress-icon.wrong { background: #dc3545; border-color: #dc3545; color: white; }

        /* Sağ Panel (Resim) */
        .image-panel {
            width: 300px; height: 300px; 
            background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            border: 4px solid #fff;
            position: sticky;
            top: 10px;
        }
        .image-panel img { width: 100%; height: 100%; object-fit: cover; }
        .no-image-msg { color: #aaa; text-align: center; font-style: italic; padding: 10px; font-size: 0.9em; }

        @media (max-width: 950px) {
            .main-layout { grid-template-columns: 1fr; }
            .image-panel { width: 100%; height: auto; aspect-ratio: 1/1; margin-top: 10px; position: static; }
            .student-panel { position: static; order: 2; }
            .quiz-panel { order: 1; min-height: auto; }
        }
    </style>
</head>
<body>

<div class="main-layout">
    
    <!-- SOL PANEL -->
    <div class="student-panel">
        <div id="login-section">
            <h3>📋 Öğrenci Giriş</h3>
            <div class="form-group">
                <label for="studentNo">Öğrenci No (0 = Konuk)</label>
                <input type="text" id="studentNo" placeholder="Örn: 2024001">
                <button class="btn" onclick="startQuiz()"> Başlat</button>
                <div id="login-error" style="color:#dc3545; font-size:0.85em; margin-top:4px; display:none; text-align:center;"></div>
            </div>
        </div>

        <div id="active-info-section" style="display:none; margin-top:8px; padding-top:8px; border-top:1px dashed #ccc;">
            <div style="margin:2px 0;">👤 <span id="active-name"></span></div>
            <div style="margin:2px 0;"> No: <span id="active-no"></span></div>
            <div style="margin:2px 0;">✅ Durum: <span id="active-score">0</span>/<span id="active-total"></span></div>
        </div>

        <div id="history-section">
            <h3>📊 Sonuçlar (Puan Sıralı)</h3>
            <div id="results-list">
                <div style="color:#999; text-align:center; padding:10px; font-size:0.85em;">Henüz sınav tamamlanmadı.</div>
            </div>
        </div>
    </div>

    <!-- ORTA PANEL -->
    <div class="quiz-panel" id="quiz-panel">
        <h2>🌍 Kimya9-2D-2Y Hazırlık</h2>
        <div id="quiz-content">
            <p style="text-align:center; color:#888; margin-top:50px; font-size:1em;">Lütfen soldan öğrenci no girerek başlayın.</p>
        </div>
        <div id="progress-tracker" style="display:none;"></div>
        
        <div id="new-quiz-area" style="display:none; text-align:center; margin-top:15px;">
            <button class="btn" style="background:#28a745; padding:10px 20px; font-size:1em;" onclick="resetForNewQuiz()">🔄 Yeni Quiz Başlat</button>
        </div>
    </div>

    <!-- SAĞ PANEL -->
    <div class="image-panel" id="image-panel">
        <div class="no-image-msg">Resim<br>Bekleniyor...</div>
    </div>

</div>

<script src="js/Kimya9-2D-2Y-Hazirlik.js"></script>


</body>
</html>
